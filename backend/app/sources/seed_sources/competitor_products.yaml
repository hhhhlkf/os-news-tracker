# =============================================
# 友商产品信息
# =============================================

# --- openEuler (友商) ---
- name: openEuler Forum
  type: rss
  url: https://forum.openeuler.org/latest.rss
  vendor: openeuler
  stream: news
  main_category: 友商产品信息
  fetch_cron: "0 */4 * * *"
- name: openEuler Release 邮件列表
  type: rss
  url: https://mailweb.openeuler.org/archives/list/release@openeuler.org/feed/
  vendor: openeuler
  stream: news
  main_category: 友商产品信息
  fetch_cron: "0 9 * * *"
  # HyperKitty 页面为 JS 渲染，page_monitor 无法抓取。改用 /feed/ RSS 端点。
  # 内容：版本 release 公告 (RC/update)，质量高。
- name: openEuler Kernel 邮件列表
  type: rss
  url: https://mailweb.openeuler.org/archives/list/kernel@openeuler.org/feed/
  vendor: openeuler
  stream: news
  main_category: 友商产品信息
  fetch_cron: "0 9 * * *"
  # HyperKitty 页面为 JS 渲染，page_monitor 无法抓取。改用 /feed/ RSS 端点。
  # 内容：内核补丁 (OLK-6.6)，技术质量极高。
- name: openEuler Repo Metadata
  type: api
  url: https://repo.openeuler.org/
  adapter: openeuler_repo
  vendor: openeuler
  stream: structured
  main_category: 友商产品信息
  enabled: false
  fetch_cron: "0 6 * * 1"
  api_config:
    probe:
      mode: html_table
      fields:
        title_template: "openEuler repo {cell[0]}"
        url_from_link: 0
        strip_cell_suffix: "/"
        exclude_href_contains:
          - "?"
          - "mailto:"
        content_template: "openEuler repository entry {cell[0]}; modified {cell[2]}"
        published_at_cell: 2

# --- Red Hat (友商) ---
- name: Red Hat Security Errata (RHSA)
  type: rss
  url: https://security.access.redhat.com/data/meta/v1/rhsa.rss
  vendor: redhat
  stream: news
  main_category: 友商产品信息
  fetch_cron: "0 */4 * * *"
  # 原 page_monitor 改为 RSS。RSS 每天发布 ~26 条 RHSA 公告 (Important/Moderate/Critical)，
  # 含 CVSS 评分 + CVE 链接，覆盖 RHEL 8/9/10。质量极高，友商安全跟踪核心源。
  # 额外结构化数据端点（待实现 adapter）：
  #   OVAL v2: https://security.access.redhat.com/data/oval/v2/
  #   CSAF v2: https://security.access.redhat.com/data/csaf/v2/
  #   OSV:    https://security.access.redhat.com/data/osv/
  # Red Hat Docs (docs.redhat.com) 返回 403，无法使用。
  # Red Hat GitHub (github.com/RedHatOfficial) 仅为 org 主页，无新闻价值。

# --- Ubuntu / Canonical (友商) ---
- name: Planet Ubuntu
  type: rss
  url: https://planet.ubuntu.com/feed.xml
  vendor: ubuntu
  stream: news
  main_category: 友商产品信息
  fetch_cron: "0 */6 * * *"
  # Ubuntu 社区博客聚合，130 条，覆盖 Ubuntu 生态（PackageKit, Incus, LXD, Ubuntu on IBM Z 等）。
  # 内容由社区/Canonical 员工发布，质量中高，是 Ubuntu 生态信息的最佳入口。
- name: Ubuntu OSV Security Notices
  type: api
  url: https://github.com/canonical/ubuntu-security-notices
  adapter: ubuntu_osv
  vendor: ubuntu
  stream: structured
  main_category: 友商产品信息
  enabled: false
  fetch_cron: "0 7 * * *"
  api_config:
    probe:
      mode: text
      url: https://raw.githubusercontent.com/canonical/ubuntu-security-notices/main/README.md
  # GitHub 仓库，每日 CI 自动更新。3 种格式：USN/LSN JSON, OSV JSON, OpenVEX JSON。
  # USN 含人类可读漏洞描述 + 受影响包 + 修复版本 + CVE 链接，可直接总结为安全新闻。
  # 与 os_tracking_news.yaml 中的 ubuntu.com/security/notices.json 内容相同，多格式冗余。
- name: Canonical Security Metadata
  type: api
  url: https://security-metadata.canonical.com/
  adapter: canonical_security_meta
  vendor: ubuntu
  stream: structured
  main_category: 友商产品信息
  enabled: false
  fetch_cron: "0 6 * * 1"
  api_config:
    probe:
      mode: html_table
      url: https://security-metadata.canonical.com/oval/
      fields:
        title_template: "Ubuntu OVAL {cell[1]}"
        url_from_link: 2
        include_href_suffix: ".bz2"
        content_template: "Ubuntu OVAL metadata file {cell[2]}; release {cell[1]}; modified {cell[3]}"
        published_at_cell: 3
  # OVAL 数据门户。112 个 .oval.xml.bz2 文件，覆盖 Ubuntu 14.04-25.10 全系 + FIPS/实时内核/OCI 变体。
  # 3 种 OVAL 类型: cve.oval, pkg.oval, usn.oval。活跃版本每日更新（jammy 8.6MB, noble 7.2MB）。
  # 与 USN JSON API 内容同源，OVAL 格式更适合合规/扫描工具集成。
