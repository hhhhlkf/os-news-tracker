# --- OpenAnolis --- #已筛选
- name: OpenAnolis News
  type: page_monitor
  url: https://openanolis.cn/news/
  vendor: openanolis
  stream: news
  main_category: OS跟踪来源
  enabled: false  # Dynamic news list; needs API adapter or reliable article selector.
  fetch_cron: "0 9 * * *"
- name: ANAS Errata
  type: page_monitor
  url: https://anas.openanolis.cn/errata
  vendor: openanolis
  stream: news
  main_category: OS跟踪来源
  enabled: false  # Dynamic advisory list; structured adapter is safer than legacy page mode.
  fetch_cron: "0 9 * * *"
- name: ANAS CVE
  type: page_monitor
  url: https://anas.openanolis.cn/cves
  vendor: openanolis
  stream: news
  main_category: OS跟踪来源
  enabled: false  # Dynamic CVE list; structured adapter is safer than legacy page mode.
  fetch_cron: "0 9 * * *"

- name: openEuler Gitee Kernel Releases
  type: page_monitor
  url: https://gitee.com/openeuler/kernel/releases
  vendor: openeuler
  stream: news
  main_category: OS跟踪来源
  fetch_cron: "0 */6 * * *"
  link_selector: ".release-list .release-item a, .release-entry h4 a, a[href*='releases/tag']"
  date_selector: ".release-time, .release-date, .time, time"
- name: openEuler Gitee Community
  type: page_monitor
  url: https://gitee.com/openeuler/community/releases
  vendor: openeuler
  stream: news
  main_category: OS跟踪来源
  fetch_cron: "0 */6 * * *"
  link_selector: ".release-list .release-item a, .release-entry h4 a, a[href*='releases/tag']"
  date_selector: ".release-time, .release-date, .time, time"

