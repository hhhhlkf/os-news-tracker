# --- OpenAnolis --- #已筛选
- name: OpenAnolis News
  type: api
  url: https://openanolis.cn/api/news/list.json
  adapter: generic_json_list
  vendor: openanolis
  stream: news
  main_category: OS跟踪来源
  enabled: true
  fetch_cron: "0 9 * * *"
  api_config:
    endpoints:
      - url: https://openanolis.cn/api/news/197349276443918351/list.json
      - url: https://openanolis.cn/api/news/242833432723031025/list.json
    headers:
      Referer: https://openanolis.cn/news/
      User-Agent: Mozilla/5.0
      Accept-Language: zh-CN,zh;q=0.9
    params:
      internationalized: false
    pagination:
      page_param: currentPage
      start_page: 1
      has_more_path: data.hasMore
      max_pages: 3
    items_path: data.items
    fields:
      title:
        - title
        - titleEn
      url_template: "https://openanolis.cn/news/{no}"
      published_at: happenDate
      content:
        - content
        - contentEn
        - abstracts
        - abstractsEn
    content_format: html
    min_content_len: 500
- name: ANAS Errata
  type: page_monitor
  url: https://anas.openanolis.cn/errata
  vendor: openanolis
  stream: news
  main_category: OS跟踪来源
  enabled: false  # Dynamic advisory list; structured adapter is safer than legacy page mode.
  fetch_cron: "0 9 * * *"
- name: ANAS CVE
  type: api
  url: https://anas.openanolis.cn/api/portal/v1/cves/
  adapter: generic_json_list
  vendor: openanolis
  stream: news
  main_category: OS跟踪来源
  enabled: true
  fetch_cron: "0 9 * * *"
  api_config:
    headers:
      Referer: https://anas.openanolis.cn/cves
      User-Agent: Mozilla/5.0
    params:
      page_size: 50
    pagination:
      page_param: page_num
      start_page: 1
      next_url_path: data.next
      max_pages: 3
    items_path: data.data
    fields:
      title: cve_id
      url_template: "https://anas.openanolis.cn/cves/detail/{cve_id}/"
      published_at: publish_date
      content:
        - abstract
        - description
        - mitigation
        - statement
    min_content_len: 80

- name: openEuler Gitee Kernel Releases
  type: page_monitor
  url: https://gitee.com/openeuler/kernel/releases
  vendor: openeuler
  stream: news
  main_category: OS跟踪来源
  fetch_cron: "0 */6 * * *"
  link_selector: ".release-list .release-item a, .release-entry h4 a, a[href*='releases/tag']"
  date_selector: ".release-time, .release-date, .time, time"
- name: openEuler Gitee Community
  type: page_monitor
  url: https://gitee.com/openeuler/community/releases
  vendor: openeuler
  stream: news
  main_category: OS跟踪来源
