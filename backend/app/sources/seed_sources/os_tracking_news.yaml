# --- OpenAnolis ---
- name: OpenAnolis News
  type: api
  url: https://openanolis.cn/api/news/list.json
  adapter: generic_json_list
  vendor: openanolis
  stream: news
  main_category: OS跟踪来源
  enabled: true
  fetch_cron: "0 9 * * *"
  api_config:
    endpoints:
      - url: https://openanolis.cn/api/news/197349276443918351/list.json
      - url: https://openanolis.cn/api/news/242833432723031025/list.json
    headers:
      Referer: https://openanolis.cn/news/
      User-Agent: Mozilla/5.0
      Accept-Language: zh-CN,zh;q=0.9
    params:
      internationalized: false
    pagination:
      page_param: currentPage
      start_page: 1
      has_more_path: data.hasMore
      max_pages: 3
    items_path: data.items
    fields:
      title:
        - title
        - titleEn
      url_template: "https://openanolis.cn/news/{no}"
      published_at: happenDate
      content:
        - content
        - contentEn
        - abstracts
        - abstractsEn
    content_format: html
    min_content_len: 500

# --- Ubuntu ---
- name: Ubuntu Security Notices
  type: api
  url: https://ubuntu.com/security/notices.json
  adapter: ubuntu_security
  vendor: ubuntu
  stream: structured
  main_category: OS跟踪来源
  enabled: false
  fetch_cron: "0 7 * * *"
  api_config:
    probe:
      mode: json_list
      items_path: notices
      fields:
        title_template: "{id}: {title}"
        url_template: "https://ubuntu.com/security/notices/{id}"
        content:
          - summary
          - description
        published_at: published
- name: Ubuntu CVE
  type: api
  url: https://ubuntu.com/security/cves.json
  adapter: ubuntu_cve
  vendor: ubuntu
  stream: structured
  main_category: OS跟踪来源
  enabled: false
  fetch_cron: "0 7 * * *"
  api_config:
    probe:
      mode: json_list
      query:
        limit: 20
      items_path: cves
      fields:
        title_template: "{id}: {priority} {status}"
        url_template: "https://ubuntu.com/security/{id}"
        content:
          - ubuntu_description
          - description
        published_at: published
- name: Ubuntu Blog
  type: rss
  url: https://ubuntu.com/blog/feed
  vendor: ubuntu
  stream: news
  main_category: OS跟踪来源
  enabled: true
  fetch_cron: "0 8 * * *"
