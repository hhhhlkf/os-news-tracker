# --- OpenAnolis ---
- name: OpenAnolis 兼容性列表平台
  type: page_monitor
  url: https://eco.openanolis.cn/
  vendor: openanolis
  stream: news
  main_category: 软件包适配
  enabled: false  # Compatibility catalog landing page; structured adapter needed.
  fetch_cron: "0 11 * * *"
- name: OpenAnolis 硬件兼容性 SIG (HCT)
  type: page_monitor
  url: https://openanolis.cn/sig/HCT
  vendor: openanolis
  stream: news
  main_category: 软件包适配
  enabled: false  # SIG landing page, not a news/article feed.
  fetch_cron: "0 11 * * 1"

