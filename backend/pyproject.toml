[project]
name = "os-news-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "feedparser>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "apscheduler>=3.10",
    "scrapling[fetchers]>=0.4",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=5.0",
    "playwright>=1.40",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=3.0",
    "langchain-openai>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]
# Only the standalone embedding worker needs these; the web image stays slim
# and never loads a model.
embedding = ["torch>=2.2", "transformers>=4.51", "huggingface-hub>=0.30", "safetensors>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that call external services or public internet sources",
    "slow: tests that are too slow or noisy for default CI runs",
]

[tool.setuptools.packages.find]
include = ["app*"]
