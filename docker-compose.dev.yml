services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osnews}
      POSTGRES_USER: ${POSTGRES_USER:-osnews_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: uvicorn app.entry:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - wechat_browser_data_dev:/var/lib/os-news-tracker/wechat-browser
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      ENABLE_SCHEDULER: "0"
      ENABLE_MAIL_SCHEDULER: "1"
      ENABLE_MORNING_CRAWL_SCHEDULER: "1"
      ENABLE_TREND_SCHEDULER: "1"
      RUN_STARTUP_BACKFILL: "0"
      WATCHFILES_FORCE_POLLING: "true"
      TRENDS_EMBEDDING_WORKER_BASE_URL: http://embedding-worker:8100
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  embedding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.embedding-worker
    working_dir: /app
    command: uvicorn app.trends.embedding_service:app --host 0.0.0.0 --port 8100 --reload
    volumes:
      - ./backend:/app
      - embedding_model_cache_dev:/var/lib/os-news-tracker/embedding-models
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      ENABLE_SCHEDULER: "0"
      ENABLE_MAIL_SCHEDULER: "0"
      ENABLE_MORNING_CRAWL_SCHEDULER: "0"
      ENABLE_TREND_SCHEDULER: "0"
      WATCHFILES_FORCE_POLLING: "true"
    mem_limit: 8g
    depends_on:
      db:
        condition: service_healthy
    # Published in dev only, for direct probing of /health and /embed.
    ports:
      - "8100:8100"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE: ""
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata_dev:
  frontend_node_modules:
  wechat_browser_data_dev:
  embedding_model_cache_dev:
