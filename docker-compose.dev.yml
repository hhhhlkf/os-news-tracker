services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osnews}
      POSTGRES_USER: ${POSTGRES_USER:-osnews_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c 'chmod 700 /var/lib/os-news-tracker/discovery-attestation && exec uvicorn app.entry:app --host 0.0.0.0 --port 8000 --reload --reload-exclude /app/connectors/sites'
    volumes:
      - ./backend:/app
      - wechat_browser_data_dev:/var/lib/os-news-tracker/wechat-browser
      - discovery_attestation_keys_dev:/var/lib/os-news-tracker/discovery-attestation
      - ./backend/connectors/sites:/var/lib/os-news-tracker/connectors/sites
      - discovery_checkpoints_dev:/var/lib/os-news-tracker/discovery-checkpoints
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/local/bin/runsc:/usr/local/bin/runsc:ro
      - /usr/local/bin/gvisor-bin:/usr/local/bin/gvisor-bin:ro
      - /etc/docker/daemon.json:/etc/docker/daemon.json:ro
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      ENABLE_SCHEDULER: "0"
      ENABLE_MAIL_SCHEDULER: "0"
      ENABLE_MORNING_CRAWL_SCHEDULER: "0"
      ENABLE_TREND_SCHEDULER: "0"
      RUN_STARTUP_BACKFILL: "0"
      WATCHFILES_FORCE_POLLING: "true"
      TRENDS_EMBEDDING_WORKER_BASE_URL: http://embedding-worker:8100
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - shared_services
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE: ""
    depends_on:
      - backend
    ports:
      - "5174:5173"

volumes:
  pgdata:
    name: os-news-tracker_pgdata
    external: true
  frontend_node_modules:
  wechat_browser_data_dev:
  discovery_attestation_keys_dev:
  discovery_checkpoints_dev:
    name: os-news-tracker_discovery_checkpoints_dev
    external: true

networks:
  shared_services:
    name: os-news-tracker_default
    external: true
