services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: osnews
      POSTGRES_USER: osnews_app
      POSTGRES_PASSWORD: OsNewsTracker2026DbA7K9M4
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osnews_app -d osnews"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://osnews_app:OsNewsTracker2026DbA7K9M4@db:5432/osnews
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
