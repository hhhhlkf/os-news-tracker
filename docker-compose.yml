services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osnews}
      POSTGRES_USER: ${POSTGRES_USER:-osnews_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - wechat_browser_data:/var/lib/os-news-tracker/wechat-browser
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      ENABLE_TREND_SCHEDULER: "1"
      TRENDS_EMBEDDING_WORKER_BASE_URL: http://embedding-worker:8100
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Single-instance CPU embedding worker for the trend fact layer. Reachable
  # only on the compose network; no host port is published. A CPU FP32 batch
  # needs roughly 4-6 GB, so the container is sized at an 8 GB limit.
  embedding-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.embedding-worker
    env_file: .env
    volumes:
      - embedding_model_cache:/var/lib/os-news-tracker/embedding-models
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      ENABLE_SCHEDULER: "0"
      ENABLE_MAIL_SCHEDULER: "0"
      ENABLE_MORNING_CRAWL_SCHEDULER: "0"
      ENABLE_TREND_SCHEDULER: "0"
    mem_limit: 8g
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8100"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  wechat_browser_data:
  # Model weights stay out of the image; the embedding worker downloads them
  # once into this volume and reloads them from there.
  embedding_model_cache:
