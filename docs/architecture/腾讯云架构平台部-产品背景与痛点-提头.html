<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品背景与痛点 · 提头｜腾讯云架构平台部</title>
<style>
  :root{
    --blue:#125ddd; --blue-d:#0958cf;
    --faint:#8a94a6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"TencentSans W3","TencentSans","PingFang SC","Microsoft YaHei",sans-serif;
    background:#eef0f4; display:grid; place-items:center; min-height:100vh; padding:24px;
  }
  .slide{
    position:relative; width:1280px; height:720px; background:#fff;
    border-radius:18px; box-shadow:0 24px 60px rgba(15,40,90,.14); overflow:hidden;
  }

  .glow{position:absolute; border-radius:50%; pointer-events:none;}
  .glow.g1{right:-150px; top:-160px; width:460px; height:460px;
    background:radial-gradient(circle, rgba(20,100,232,.13), rgba(20,100,232,.05) 45%, transparent 72%);}
  .glow.g2{left:-170px; bottom:-190px; width:480px; height:480px;
    background:radial-gradient(circle, rgba(9,88,207,.11), rgba(9,88,207,.045) 45%, transparent 72%);}

  .top-rule{position:absolute; inset:7.4% 0 auto 0; width:100%; height:3.32%; object-fit:fill; pointer-events:none;}
  .brand{position:absolute; top:1.95%; right:1.45%; width:16.2%; z-index:1;}

  .head{
    position:absolute; left:40px; top:1.95%; height:5.1%;
    display:flex; align-items:center; z-index:2;
  }
  .head h1{
    font-family:"TencentSans W7","TencentSans","PingFang SC",sans-serif;
    font-size:26px; font-weight:800; color:var(--blue); letter-spacing:2px;
  }
</style>
</head>
<body>

<div class="slide">
  <div class="glow g1" aria-hidden="true"></div>
  <div class="glow g2" aria-hidden="true"></div>
  <img class="top-rule" src="_ref_x-0.01_y0.51_w13.35_h0.2.png" alt="">
  <img class="brand" src="_ref_x11.76_y0.35_w1.33_h0.24.png" alt="云架构平台部">

  <header class="head">
    <h1>产品背景与痛点</h1>
  </header>
</div>

</body>
</html>
