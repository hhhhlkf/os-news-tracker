server {
  listen 80;
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
  location /api/ {
    proxy_pass http://backend:8000/;
  }
  # Keep in sync with frontend/vite.config.ts proxy prefixes.
  location /items {
    proxy_pass http://backend:8000;
  }
  location /facets {
    proxy_pass http://backend:8000;
  }
  location /run-logs {
    proxy_pass http://backend:8000;
  }
  location /sources {
    proxy_pass http://backend:8000;
  }
  location /crawl-sources {
    proxy_pass http://backend:8000;
  }
  location /discovery {
    proxy_pass http://backend:8000;
  }
  location /discussions {
    proxy_pass http://backend:8000;
  }
  location /mail {
    proxy_pass http://backend:8000;
  }
  location /auth {
    proxy_pass http://backend:8000;
  }
  location /system-morning-crawl {
    proxy_pass http://backend:8000;
  }
  location /trends/templates {
    proxy_pass http://backend:8000;
  }
  location /trends/settings {
    proxy_pass http://backend:8000;
  }
  location /trends/embedding {
    proxy_pass http://backend:8000;
  }
  location /trends/cards {
    proxy_pass http://backend:8000;
  }
  location /trends/vectors {
    proxy_pass http://backend:8000;
  }
  location /trends/clusters {
    proxy_pass http://backend:8000;
  }
  location /trends/storylines {
    proxy_pass http://backend:8000;
  }
  location /trends/runs {
    proxy_pass http://backend:8000;
  }
  location /trends/results {
    proxy_pass http://backend:8000;
  }
  location /trends/schedule {
    proxy_pass http://backend:8000;
  }
  location /wechat-auth/profile {
    proxy_pass http://backend:8000;
  }
  location /wechat-auth/qr-sessions {
    proxy_pass http://backend:8000;
  }
  location /statistics/token-usage/ {
    proxy_pass http://backend:8000/statistics/token-usage/;
  }
  location /statistics/item-volume/ {
    proxy_pass http://backend:8000/statistics/item-volume/;
  }
}
