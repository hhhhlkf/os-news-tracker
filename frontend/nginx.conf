server {
  listen 80;
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
  location /api/ {
    proxy_pass http://backend:8000/;
  }
  location = /wechat-auth/profile {
    proxy_pass http://backend:8000;
  }
  location /wechat-auth/qr-sessions {
    proxy_pass http://backend:8000;
  }
  location /statistics/token-usage/ {
    proxy_pass http://backend:8000/statistics/token-usage/;
  }
  location /statistics/item-volume/ {
    proxy_pass http://backend:8000/statistics/item-volume/;
  }
}
